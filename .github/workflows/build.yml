name: Build AospKSU Kernel

on:
  workflow_dispatch:
    inputs:
      target_device:
        description: 'Target Device'
        required: true
        type: choice
        options:
          - all (starqltechn, star2qltechn, crownqltechn)
          - starqltechn (Galaxy S9)
          - star2qltechn (Galaxy S9+)
          - crownqltechn (Galaxy Note 9)
        default: 'all (starqltechn, star2qltechn, crownqltechn)'

permissions:
  contents: write

concurrency:
  group: aospksu-kernel-build
  cancel-in-progress: false

env:
  KERNEL_REPO: https://gitlab.com/samsung-sdm845/android_kernel_samsung_sdm845.git
  KERNEL_BRANCH: lineage-22.2
  CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r487747c.tar.gz

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CCACHE_MAXSIZE: 3G
      CCACHE_COMPRESS: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential bc flex bison libssl-dev libelf-dev libncurses5-dev \
            zstd dwarves cpio python-is-python3 device-tree-compiler curl zip ccache \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Checkout Kernel Source
        run: |
          git clone -b "$KERNEL_BRANCH" "$KERNEL_REPO" --depth=1 kernel

      - name: Setup Clang
        run: |
          mkdir -p ~/clang
          curl -LSs "$CLANG_URL" | tar -xz -C ~/clang
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"

      - name: Setup KernelSU
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/doubledashdot/sKernelSU/master/kernel/setup.sh" | bash -s master

      - name: Configure LOCALVERSION
        working-directory: kernel
        run: |
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-AospKSU"/' arch/arm64/configs/sdm845_defconfig
          echo 'CONFIG_LOCALVERSION="-AospKSU"' >> arch/arm64/configs/sdm845_defconfig

      - name: Prepare Output Directory
        run: mkdir -p output

      - name: Build starqltechn
        if: ${{ inputs.target_device == 'all (starqltechn, star2qltechn, crownqltechn)' || inputs.target_device == 'starqltechn (Galaxy S9)' }}
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC_ARM32=arm-linux-gnueabi-gcc

          rm -rf out && mkdir -p out
          make O=out CC="ccache clang" CC_ARM32="arm-linux-gnueabi-gcc" sdm845_defconfig starqlte_chn.config
          make -j"$(nproc --all)" O=out CC="ccache clang" CC_ARM32="arm-linux-gnueabi-gcc" Image.gz-dtb

          cp out/arch/arm64/boot/Image.gz-dtb ../AnyKernel3/Image.gz-dtb

          cd ../AnyKernel3
          zip -r9 "../output/AnyKernel3-AospKSU-starqltechn-${{ github.run_number }}.zip" . \
            -x ".git/*" ".github/*" "*.zip" "Image.gz-dtb-*"
          rm -f Image.gz-dtb

      - name: Build star2qltechn
        if: ${{ inputs.target_device == 'all (starqltechn, star2qltechn, crownqltechn)' || inputs.target_device == 'star2qltechn (Galaxy S9+)' }}
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC_ARM32=arm-linux-gnueabi-gcc

          rm -rf out && mkdir -p out
          make O=out CC="ccache clang" CC_ARM32="arm-linux-gnueabi-gcc" sdm845_defconfig star2qlte_chn.config
          make -j"$(nproc --all)" O=out CC="ccache clang" CC_ARM32="arm-linux-gnueabi-gcc" Image.gz-dtb

          cp out/arch/arm64/boot/Image.gz-dtb ../AnyKernel3/Image.gz-dtb

          cd ../AnyKernel3
          zip -r9 "../output/AnyKernel3-AospKSU-star2qltechn-${{ github.run_number }}.zip" . \
            -x ".git/*" ".github/*" "*.zip" "Image.gz-dtb-*"
          rm -f Image.gz-dtb

      - name: Build crownqltechn
        if: ${{ inputs.target_device == 'all (starqltechn, star2qltechn, crownqltechn)' || inputs.target_device == 'crownqltechn (Galaxy Note 9)' }}
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC_ARM32=arm-linux-gnueabi-gcc

          rm -rf out && mkdir -p out
          make O=out CC="ccache clang" CC_ARM32="arm-linux-gnueabi-gcc" sdm845_defconfig crownqlte_chn.config
          make -j"$(nproc --all)" O=out CC="ccache clang" CC_ARM32="arm-linux-gnueabi-gcc" Image.gz-dtb

          cp out/arch/arm64/boot/Image.gz-dtb ../AnyKernel3/Image.gz-dtb

          cd ../AnyKernel3
          zip -r9 "../output/AnyKernel3-AospKSU-crownqltechn-${{ github.run_number }}.zip" . \
            -x ".git/*" ".github/*" "*.zip" "Image.gz-dtb-*"
          rm -f Image.gz-dtb

      - name: Build Unified AnyKernel3
        if: ${{ inputs.target_device == 'all (starqltechn, star2qltechn, crownqltechn)' }}
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC_ARM32=arm-linux-gnueabi-gcc

          rm -rf out && mkdir -p out
          make O=out CC="ccache clang" CC_ARM32="arm-linux-gnueabi-gcc" sdm845_defconfig starqlte_chn.config
          make -j"$(nproc --all)" O=out CC="ccache clang" CC_ARM32="arm-linux-gnueabi-gcc" Image.gz-dtb
          cp out/arch/arm64/boot/Image.gz-dtb ../AnyKernel3/Image.gz-dtb-starqltechn

          rm -rf out && mkdir -p out
          make O=out CC="ccache clang" CC_ARM32="arm-linux-gnueabi-gcc" sdm845_defconfig star2qlte_chn.config
          make -j"$(nproc --all)" O=out CC="ccache clang" CC_ARM32="arm-linux-gnueabi-gcc" Image.gz-dtb
          cp out/arch/arm64/boot/Image.gz-dtb ../AnyKernel3/Image.gz-dtb-star2qltechn

          rm -rf out && mkdir -p out
          make O=out CC="ccache clang" CC_ARM32="arm-linux-gnueabi-gcc" sdm845_defconfig crownqlte_chn.config
          make -j"$(nproc --all)" O=out CC="ccache clang" CC_ARM32="arm-linux-gnueabi-gcc" Image.gz-dtb
          cp out/arch/arm64/boot/Image.gz-dtb ../AnyKernel3/Image.gz-dtb-crownqltechn

          cd ../AnyKernel3
          zip -r9 "../output/AnyKernel3-AospKSU-Unified-SDM845-${{ github.run_number }}.zip" . \
            -x ".git/*" ".github/*" "*.zip"
          rm -f Image.gz-dtb-* Image.gz-dtb

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.9.337-AospKSU-${{ github.run_number }}
          name: AospKSU 4.9.337 - Run ${{ github.run_number }}
          body: |
            AospKSU Kernel 4.9.337 by fwlta
            - Branch: lineage-22.2
            - KernelSU (sKernelSU)
            - Devices: starqltechn, star2qltechn, crownqltechn
          files: output/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
